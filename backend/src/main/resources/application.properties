spring.config.import=optional:file:./.env[.properties],optional:file:../.env[.properties]

spring.application.name=vovremya
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/vovremya}
spring.datasource.username=${DB_USERNAME:vovremya}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.open-in-view=false

server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never

app.demo.name=${APP_DEMO_NAME:}
app.demo.email=${APP_DEMO_EMAIL:}
app.demo.password=${APP_DEMO_PASSWORD:}

app.jwt.secret=${APP_JWT_SECRET:}
app.jwt.ttl-hours=${APP_JWT_TTL_HOURS:168}
